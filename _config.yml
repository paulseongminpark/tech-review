future: true
title: Tech Review
description: Daily tech trend analysis
url: "https://paulseongminpark.github.io"
baseurl: "/tech-review"
markdown: kramdown
permalink: /:year/:month/:day/:title/

exclude:
  - docs/
  - scripts/
  - _tmp/
  - "*.py"
  - "*.sh"
  - "*.ps1"
  - Gemfile
  - Gemfile.lock

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
