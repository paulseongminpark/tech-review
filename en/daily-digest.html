---
layout: default
title: Daily Digest
lang: en
permalink: /en/daily-digest/
---

<div style="display:flex; gap:1.5rem; min-height:60vh;">

  <!-- Left: Date panel -->
  <div id="date-panel" style="width:120px; flex-shrink:0; border-right:1px solid #eee; padding-right:1rem;">
    <p style="font-size:0.75rem; color:#999; margin-bottom:0.75rem; text-transform:uppercase; letter-spacing:0.05em;">Dates</p>
    <div id="date-list"></div>
  </div>

  <!-- Right: Tag toggle + Card grid -->
  <div style="flex:1; min-width:0;">
    <div id="tag-toggle" style="display:flex; flex-wrap:wrap; gap:0.4rem; margin-bottom:1.25rem;"></div>
    <div id="card-grid" style="display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:0.75rem;"></div>
  </div>
</div>

<script>
const SECTIONS = [];
{% for item in site.data.sections %}
  {% assign d = item[1] %}
  {% if d.lang == 'en' %}
    {% for s in d.sections %}
SECTIONS.push({
  date: {{ d.date | jsonify }},
  post_url: {{ d.post_url | prepend: site.baseurl | jsonify }},
  post_title: {{ d.post_title | jsonify }},
  index: {{ s.index }},
  title: {{ s.title | jsonify }},
  tags: {{ s.tags | jsonify }},
  anchor: {{ s.anchor | jsonify }}
});
    {% endfor %}
  {% endif %}
{% endfor %}

SECTIONS.sort((a, b) => b.date.localeCompare(a.date));

// Tag count = number of dates (posts) using that tag, not sections
const tagDateMap = {};
SECTIONS.forEach(s => {
  (s.tags || []).forEach(t => {
    if (!tagDateMap[t]) tagDateMap[t] = new Set();
    tagDateMap[t].add(s.date);
  });
});
const tagMap = {};
Object.keys(tagDateMap).forEach(t => { tagMap[t] = { count: tagDateMap[t].size }; });
const allTags = Object.keys(tagMap).sort((a, b) => tagMap[b].count - tagMap[a].count);
const allDates = [...new Set(SECTIONS.map(s => s.date))];

let activeDate = null;
let activeTag = null;

function renderDateList() {
  document.getElementById('date-list').innerHTML =
    ['all', ...allDates].map(d =>
      `<div onclick="selectDate('${d}')"
           style="padding:0.3rem 0; font-size:0.82rem; cursor:pointer;
                  color:${d === (activeDate || 'all') ? '#1a1a1a' : '#999'};
                  font-weight:${d === (activeDate || 'all') ? '600' : '400'}">
         ${d === 'all' ? 'All' : d.slice(5)}
       </div>`
    ).join('');
}

function renderTagToggle() {
  let filtered = SECTIONS;
  if (activeDate) filtered = filtered.filter(s => s.date === activeDate);
  const tDateMap = {};
  filtered.forEach(s => { (s.tags || []).forEach(t => {
    if (!tDateMap[t]) tDateMap[t] = new Set();
    tDateMap[t].add(s.date);
  }); });
  const tMap = {};
  Object.keys(tDateMap).forEach(t => { tMap[t] = tDateMap[t].size; });
  const tags = Object.keys(tMap).sort((a, b) => tMap[b] - tMap[a]);
  const allDateCount = [...new Set(filtered.map(s => s.date))].length;

  document.getElementById('tag-toggle').innerHTML =
    ['all', ...tags].map(t => {
      const count = t === 'all' ? allDateCount : tMap[t];
      const isActive = t === (activeTag || 'all');
      return `<button onclick="selectTag('${t}')"
        style="background:${isActive ? '#1a1a1a' : '#f0f0f0'}; color:${isActive ? '#fff' : '#444'};
               border:none; padding:0.3rem 0.65rem; border-radius:4px; font-size:0.8rem; cursor:pointer;">
        ${t === 'all' ? 'All' : t} <span style="opacity:0.6;">${count}</span>
      </button>`;
    }).join('');
}

function renderCards() {
  let filtered = SECTIONS;
  if (activeDate) filtered = filtered.filter(s => s.date === activeDate);
  if (activeTag) filtered = filtered.filter(s => (s.tags || []).includes(activeTag));

  if (activeTag) {
    // Group by date — show one entry per date even if multiple sections match
    const dateGroups = {};
    filtered.forEach(s => {
      if (!dateGroups[s.date]) dateGroups[s.date] = [];
      dateGroups[s.date].push(s);
    });
    const dates = Object.keys(dateGroups).sort((a, b) => b.localeCompare(a));

    document.getElementById('card-grid').style.gridTemplateColumns = '1fr';
    document.getElementById('card-grid').innerHTML = dates.map(date => {
      const sections = dateGroups[date];
      const first = sections[0];
      return `<a href="${first.post_url}#${first.anchor}"
          style="display:block; padding:0.75rem; border:1px solid #eee; border-radius:6px;
                 text-decoration:none; color:#1a1a1a;">
         <div style="font-size:0.75rem; color:#999; margin-bottom:0.3rem;">${date}</div>
         <div style="font-size:0.9rem; font-weight:600; line-height:1.4;">${first.post_title || first.title}</div>
       </a>`;
    }).join('');
    return;
  }

  const tagCounts = {};
  filtered.forEach(s => { (s.tags || []).forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; }); });
  const tags = Object.keys(tagCounts).sort((a, b) => tagCounts[b] - tagCounts[a]);

  document.getElementById('card-grid').style.gridTemplateColumns = 'repeat(auto-fill,minmax(140px,1fr))';
  document.getElementById('card-grid').innerHTML = tags.map(t =>
    `<div onclick="selectTag('${t}')"
         style="aspect-ratio:1; background:#f8f8f8; border-radius:8px; padding:1rem;
                display:flex; flex-direction:column; justify-content:space-between;
                cursor:pointer; border:1px solid #eee; transition:border-color 0.15s;"
         onmouseover="this.style.borderColor='#999'" onmouseout="this.style.borderColor='#eee'">
       <div style="font-size:1rem; font-weight:700; color:#1a1a1a;">#${t}</div>
       <div style="font-size:0.78rem; color:#888;">${tagCounts[t]} sections</div>
     </div>`
  ).join('');
}

function selectDate(d) {
  activeDate = d === 'all' ? null : d;
  activeTag = null;
  renderDateList();
  renderTagToggle();
  renderCards();
}

function selectTag(t) {
  activeTag = t === 'all' ? null : t;
  renderTagToggle();
  renderCards();
}

renderDateList();
renderTagToggle();
renderCards();
</script>
