---
layout: default
title: Twitter
lang: en
permalink: /en/twitter/
---

<style>
  .bm-header {
    display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.75rem;
  }
  .bm-header h1 { font-size: 1.3rem; font-weight: 700; margin: 0; }
  .bm-badge {
    font-size: 0.72rem; color: #888; background: #f5f5f5;
    border: 1px solid #e0e0e0; padding: 0.2rem 0.55rem;
    border-radius: 20px; letter-spacing: 0.02em;
  }

  .bm-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem;
  }
  @media (max-width: 900px) { .bm-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 540px) { .bm-grid { grid-template-columns: 1fr; } }

  .bm-card {
    border: 1px solid #e8e8e8; border-radius: 10px; padding: 1.1rem;
    aspect-ratio: 1 / 1; overflow: hidden; display: flex; flex-direction: column;
    cursor: pointer; transition: box-shadow 0.15s, border-color 0.15s, transform 0.15s;
    background: #fff;
  }
  .bm-card:hover {
    box-shadow: 0 4px 14px rgba(0,0,0,0.09); border-color: #bbb; transform: translateY(-2px);
  }
  .bm-meta {
    font-size: 0.72rem; color: #aaa; margin-bottom: 0.5rem;
    display: flex; align-items: center; gap: 0.35rem; flex-wrap: wrap;
  }
  .bm-meta strong { color: #555; }
  .bm-card-label {
    font-size: 0.62rem; font-weight: 700; color: #bbb;
    text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 0.25rem;
  }
  .bm-why {
    font-size: 0.86rem; font-weight: 600; color: #1a1a1a;
    line-height: 1.5; overflow: hidden;
  }
  .bm-tags { margin-top: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.3rem; }
  .bm-tag {
    background: #f0f4ff; color: #2244aa; font-size: 0.68rem;
    padding: 0.12rem 0.4rem; border-radius: 4px; white-space: nowrap;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis;
  }
  .bm-more {
    margin-top: 0.5rem; font-size: 0.7rem; color: #aaa; display: inline-block; user-select: none;
  }

  .bm-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.45); z-index: 1000;
    align-items: center; justify-content: center; padding: 2rem;
    backdrop-filter: blur(2px);
  }
  .bm-overlay.active { display: flex; animation: overlayIn 0.18s ease; }
  @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }

  .bm-modal {
    background: #fff; border-radius: 14px; width: 100%; max-width: 900px;
    max-height: 80vh; display: flex; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.20); animation: modalIn 0.2s ease;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.96) translateY(8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .bm-modal-left {
    flex: 0 0 42%; padding: 2rem 2rem 1.5rem; border-right: 1px solid #eee;
    display: flex; flex-direction: column; gap: 1.2rem; overflow-y: auto;
  }
  .bm-modal-meta {
    font-size: 0.74rem; color: #aaa;
    display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap;
    padding-bottom: 1rem; border-bottom: 1px solid #f0f0f0;
  }
  .bm-modal-meta strong { color: #333; font-size: 0.78rem; }
  .bm-modal-meta a { color: #0066cc; text-decoration: none; }
  .bm-modal-meta a:hover { text-decoration: underline; }

  .bm-sec-label {
    font-size: 0.62rem; font-weight: 700; color: #2244aa;
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.4rem;
  }
  .bm-sec-body { font-size: 0.88rem; color: #1a1a1a; line-height: 1.65; }
  .bm-sec-body.why { font-weight: 600; }
  .bm-sec-body.dim { color: #444; font-size: 0.84rem; }

  .bm-points { list-style: none; padding: 0; margin: 0; }
  .bm-points li {
    font-size: 0.8rem; color: #444;
    padding: 0.22rem 0 0.22rem 1rem; position: relative; line-height: 1.5;
  }
  .bm-points li::before { content: '›'; position: absolute; left: 0; color: #0066cc; }

  .bm-modal-close {
    margin-top: auto; padding-top: 1rem; font-size: 0.72rem; color: #bbb;
    cursor: pointer; user-select: none; display: inline-block; transition: color 0.15s;
  }
  .bm-modal-close:hover { color: #333; }

  .bm-modal-right {
    flex: 1; padding: 2rem 2.2rem; overflow-y: auto;
    background: #fafaf9; display: flex; flex-direction: column;
  }
  .bm-tweet-label {
    font-size: 0.62rem; font-weight: 700; color: #2244aa;
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 1.2rem;
  }
  .bm-tweet-body {
    font-size: 0.76rem; color: #1a1a1a; line-height: 1.65;
    white-space: pre-line;
    font-family: 'Noto Sans KR', 'Inter', sans-serif; flex: 1;
  }
  .bm-tweet-body.en {
    font-family: 'Inter', sans-serif; font-size: 0.76rem; color: #1a1a1a; line-height: 1.65;
  }
</style>

<div class="bm-header">
  <h1>Twitter Bookmarks</h1>
  <span class="bm-badge">Summarized by Claude</span>
</div>

<div class="bm-grid" id="bm-grid"></div>

<div class="bm-overlay" id="bm-overlay" onclick="handleOverlayClick(event)">
  <div class="bm-modal" id="bm-modal">
    <div class="bm-modal-left" id="bm-modal-left"></div>
    <div class="bm-modal-right" id="bm-modal-right"></div>
  </div>
</div>

<script>
const BOOKMARKS = ({{ site.data.bookmarks | jsonify }}).sort((a, b) => {
  const da = a.added_at || a.date || "";
  const db = b.added_at || b.date || "";
  if (db !== da) return db.localeCompare(da);
  return (b.id || "").localeCompare(a.id || "");
});

function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderGrid() {
  const grid = document.getElementById('bm-grid');
  if (!BOOKMARKS || BOOKMARKS.length === 0) {
    grid.innerHTML = '<p style="color:#bbb;">No bookmarks yet.</p>';
    return;
  }
  grid.innerHTML = BOOKMARKS.map((bm, i) => {
    const tags = (bm.tech_stack || []).slice(0, 3).map(t =>
      `<span class="bm-tag">${escHtml(t)}</span>`
    ).join('');
    const whatsHappening = bm.whats_happening || bm.smart_brevity?.why || '—';
    const preview = whatsHappening.length > 110 ? whatsHappening.slice(0, 110) + '…' : whatsHappening;
    const hasDetail = !!(bm.why_it_matters || bm.smart_brevity?.what ||
                        (bm.apply_points||[]).length || bm.translation || bm.text);
    return `
    <div class="bm-card" onclick="openModal(${i})">
      <div class="bm-meta">
        <strong>@${escHtml(bm.author || '—')}</strong>
        <span>·</span>
        <span>${(bm.added_at || bm.date || '').slice(0,10)}</span>
      </div>
      <p class="bm-card-label">What's happening</p>
      <div class="bm-why">${escHtml(preview)}</div>
      ${tags ? `<div class="bm-tags">${tags}</div>` : ''}
      ${hasDetail ? `<span class="bm-more">More →</span>` : ''}
    </div>`;
  }).join('');
}

function openModal(i) {
  const bm = BOOKMARKS[i];
  const whatsHappening = bm.whats_happening || bm.smart_brevity?.why || '';
  const whyItMatters   = bm.why_it_matters  || bm.smart_brevity?.what || '';
  const applyList = (bm.apply_points || []).map(p => `<li>${escHtml(p)}</li>`).join('');
  const tweetContent   = bm.translation || bm.text || '';

  document.getElementById('bm-modal-left').innerHTML = `
    <div class="bm-modal-meta">
      <strong>@${escHtml(bm.author || '—')}</strong>
      <span>·</span>
      <span>${(bm.added_at || bm.date || '').slice(0,10)}</span>
      ${bm.url ? `<span>·</span><a href="${bm.url}" target="_blank" rel="noopener">View tweet →</a>` : ''}
    </div>
    ${whatsHappening ? `
    <div>
      <p class="bm-sec-label">What's happening</p>
      <p class="bm-sec-body why">${escHtml(whatsHappening)}</p>
    </div>` : ''}
    ${whyItMatters ? `
    <div>
      <p class="bm-sec-label">Why it matters</p>
      <p class="bm-sec-body dim">${escHtml(whyItMatters)}</p>
    </div>` : ''}
    ${applyList ? `
    <div>
      <p class="bm-sec-label">Apply Points</p>
      <ul class="bm-points">${applyList}</ul>
    </div>` : ''}
    <span class="bm-modal-close" onclick="closeModal()">Close ✕</span>
  `;

  const baseurl = "{{ site.baseurl }}";
  const legacyImages = (bm.tweet_images || []).map(src =>
    `<img src="${baseurl}${src}" alt="tweet image" style="width:100%;border-radius:8px;margin-top:1rem;display:block;">`
  ).join('');

  const bodyText = escHtml(tweetContent).replace(
    /(https?:\/\/\S+)/g,
    `<a href="$1" target="_blank" rel="noopener" style="color:#0066cc;word-break:break-all;">$1</a>`
  );

  let cardHtml = '';
  if (bm.card) {
    const c = bm.card;
    const thumbStyle = c.thumbnail ? `background-image:url('${c.thumbnail}')` : '';
    cardHtml = `
    <a class="bm-link-card" href="${c.url || bm.url}" target="_blank" rel="noopener" style="display:flex;border:1px solid #e0e0e0;border-radius:12px;overflow:hidden;margin-top:1rem;text-decoration:none;color:inherit;">
      ${c.thumbnail ? `<div style="flex:0 0 120px;background-size:cover;background-position:center;min-height:90px;${thumbStyle}"></div>` : ''}
      <div style="padding:0.7rem 0.9rem;flex:1;min-width:0;">
        <div style="font-size:0.65rem;color:#888;">${escHtml(c.domain || '')}</div>
        <div style="font-size:0.78rem;font-weight:600;color:#1a1a1a;">${escHtml(c.title || '')}</div>
        ${c.description ? `<div style="font-size:0.68rem;color:#666;margin-top:0.2rem;">${escHtml(c.description)}</div>` : ''}
      </div>
    </a>`;
  }

  let mediaHtml = '';
  const media = bm.media || [];
  if (media.length > 0) {
    const items = media.slice(0, 4).map(m => {
      const isVideo = m.type === 'video' || m.type === 'animated_gif';
      const clickUrl = isVideo && m.video_url ? m.video_url : m.url;
      return `<div style="position:relative;overflow:hidden;background:#f0f0f0;">
        <a href="${clickUrl}" target="_blank" rel="noopener">
          <img src="${m.url}" alt="media" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block;">
          ${isVideo ? '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.25);"><div style="width:0;height:0;border-left:18px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent;"></div></div>' : ''}
        </a>
      </div>`;
    }).join('');
    mediaHtml = `<div style="display:grid;gap:4px;margin-top:1rem;border-radius:12px;overflow:hidden;grid-template-columns:${media.length > 1 ? '1fr 1fr' : '1fr'};">${items}</div>`;
  }

  document.getElementById('bm-modal-right').innerHTML = `
    <p class="bm-tweet-label">Original</p>
    <p class="bm-tweet-body">${bodyText}</p>
    ${mediaHtml}
    ${cardHtml}
    ${legacyImages}
  `;

  document.getElementById('bm-overlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('bm-overlay').classList.remove('active');
  document.body.style.overflow = '';
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('bm-overlay')) closeModal();
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

renderGrid();

// Hash deep-link: /{lang}/twitter/#bm-027
(function() {
  function openByHash() {
    var id = window.location.hash.slice(1);
    if (!id) return;
    var idx = BOOKMARKS.findIndex(function(b) { return b.id === id; });
    if (idx !== -1) openModal(idx);
  }
  openByHash();
  window.addEventListener('hashchange', openByHash);
})();
</script>
