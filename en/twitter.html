layout: default
title: Twitter
lang: en
permalink: /en/twitter/
---

<!-- ============================
     BOOKMARKS SECTION
     ============================ -->
<div id="bookmarks-section">

  <div style="display:flex; align-items:center; gap:0.75rem; margin-bottom:1.5rem;">
    <h1 style="font-size:1.3rem; font-weight:700; margin:0;">Twitter Bookmarks</h1>
    <span style="font-size:0.75rem; color:#888; background:#f5f5f5; border:1px solid #e0e0e0;
                 padding:0.2rem 0.55rem; border-radius:20px; letter-spacing:0.02em;">
      Translated by Claude
    </span>
  </div>

  <div id="bookmark-list"></div>
</div>

<script>
/* ── BOOKMARKS ── */
const BOOKMARKS = {{ site.data.bookmarks | jsonify }};

function renderBookmarks() {
  const el = document.getElementById('bookmark-list');
  if (!BOOKMARKS || BOOKMARKS.length === 0) {
    el.innerHTML = '<p style="color:#bbb; font-size:0.9rem; margin-bottom:0.5rem;">No bookmarks yet.</p>';
    return;
  }

  el.innerHTML = BOOKMARKS.map(bm => `
    <div style="padding:1.25rem; border:1px solid #eee; border-radius:8px; margin-bottom:1.25rem;">

      <!-- meta -->
      <div style="font-size:0.78rem; color:#999; margin-bottom:0.75rem; display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap;">
        <strong style="color:#444;">@${bm.author || '—'}</strong>
        <span>·</span>
        <span>${(bm.date || '').slice(0,10)}</span>
        ${bm.url ? `<span>·</span><a href="${bm.url}" target="_blank" rel="noopener" style="color:#0066cc;">Source →</a>` : ''}
      </div>

      <!-- Smart Brevity -->
      <p style="font-size:0.82rem; font-weight:700; color:#555; margin-bottom:0.3rem; text-transform:uppercase; letter-spacing:0.06em;">
        Why it matters
      </p>
      <p style="font-size:1rem; font-weight:600; color:#1a1a1a; margin-bottom:0.9rem; line-height:1.5;">
        ${bm.smart_brevity?.why || '—'}
      </p>

      <p style="font-size:0.82rem; font-weight:700; color:#555; margin-bottom:0.3rem; text-transform:uppercase; letter-spacing:0.06em;">
        What's happening
      </p>
      <p style="font-size:0.92rem; color:#333; line-height:1.65; margin-bottom:1.1rem; white-space:pre-line;">
        ${bm.smart_brevity?.what || '—'}
      </p>

      <!-- Tech / Stack -->
      ${bm.tech_stack && bm.tech_stack.length ? `
      <div style="margin-bottom:0.9rem;">
        <p style="font-size:0.78rem; font-weight:700; color:#555; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:0.4rem;">
          Tech / Stack
        </p>
        <div style="display:flex; flex-wrap:wrap; gap:0.35rem;">
          ${bm.tech_stack.map(t => `<span style="background:#f0f4ff; color:#2244aa; font-size:0.8rem; padding:0.2rem 0.5rem; border-radius:4px;">${t}</span>`).join('')}
        </div>
      </div>` : ''}

      <!-- Apply points -->
      ${bm.apply_points && bm.apply_points.length ? `
      <div style="margin-bottom:0.75rem;">
        <p style="font-size:0.78rem; font-weight:700; color:#555; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:0.4rem;">
          Apply to Our Projects
        </p>
        <ul style="list-style:none; padding:0; margin:0;">
          ${bm.apply_points.map(p => `<li style="font-size:0.88rem; color:#333; padding:0.15rem 0; padding-left:0.9rem; position:relative;"><span style="position:absolute;left:0;color:#0066cc;">›</span>${p}</li>`).join('')}
        </ul>
      </div>` : ''}

      <!-- Explore points -->
      ${bm.explore_points && bm.explore_points.length ? `
      <div>
        <p style="font-size:0.78rem; font-weight:700; color:#555; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:0.4rem;">
          Worth Exploring
        </p>
        <ul style="list-style:none; padding:0; margin:0;">
          ${bm.explore_points.map(p => `<li style="font-size:0.88rem; color:#555; padding:0.15rem 0; padding-left:0.9rem; position:relative;"><span style="position:absolute;left:0;color:#aaa;">›</span>${p}</li>`).join('')}
        </ul>
      </div>` : ''}

    </div>
  `).join('');
}

renderBookmarks();
</script>
