---
layout: default
title: YouTube
lang: en
permalink: /en/youtube/
---

<style>
/* ── body override ── */
body {
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
}
nav.site-nav {
  margin-left: 220px !important;
  padding: 0.75rem 1.5rem !important;
  position: relative;
  z-index: 200;
  background: #fff;
}

/* ── 서브탭 ── */
.yt-subtabs {
  margin-left: 220px;
  padding: 0 1.5rem;
  background: #fff;
  border-bottom: 1px solid #eee;
  display: flex;
  gap: 0;
  position: relative;
  z-index: 199;
}
.yt-subtab {
  padding: 0.45rem 1rem;
  font-size: 0.78rem;
  font-weight: 500;
  color: #999;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
  text-transform: capitalize;
  letter-spacing: 0.02em;
}
.yt-subtab:hover { color: #666; }
.yt-subtab.active { color: #D4632D; font-weight: 700; border-bottom-color: #D4632D; }
@media (max-width: 768px) {
  .yt-subtabs { margin-left: 0; }
}

/* ── TOC 사이드바 ── */
.yt-toc {
  position: fixed;
  left: 0;
  top: 0;
  width: 220px;
  height: 100vh;
  overflow-y: auto;
  border-right: 1px solid #e8e8e8;
  background: #fafafa;
  z-index: 50;
  padding: 54px 12px 24px;
  box-sizing: border-box;
  scrollbar-width: none;
}
.yt-toc::-webkit-scrollbar { display: none; }
.yt-toc-item {
  display: block;
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  font-weight: 400;
  color: #4f4f4f;
  text-decoration: none;
  padding: 5px 8px;
  border-radius: 4px;
  margin-bottom: 2px;
  line-height: 1.4;
  transition: background 0.15s, color 0.15s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.yt-toc-item:hover { background: #f0f0f0; }
.yt-toc-num {
  font-size: 0.65em;
  color: #bbb;
  font-weight: 400;
  margin-right: 5px;
  letter-spacing: 0;
}
.yt-toc-item.active {
  color: #D4632D;
  font-weight: 600;
  background: rgba(212,99,45,0.08);
}
.yt-toc-child {
  display: block;
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  font-weight: 400;
  color: #999;
  text-decoration: none;
  padding: 3px 8px 3px 14px;
  border-radius: 3px;
  margin-bottom: 1px;
  line-height: 1.35;
  margin-left: 6px;
  transition: background 0.15s, color 0.15s;
}
.yt-toc-child:hover { background: #f0f0f0; color: #444; }
.yt-toc-child.active { color: #D4632D; font-weight: 600; }

/* ── 메인 콘텐츠 ── */
.yt-main {
  margin-left: 220px;
  padding: 2rem 1.5rem 4rem;
}

/* ── 영상 카드 ── */
.yt-article {
  padding: 1.2rem 0 2.5rem;
  border-bottom: 1px solid #eee;
  scroll-margin-top: 1rem;
}
.yt-article:last-child { border-bottom: none; }
.yt-expand-hint {
  margin: 0.6rem 0 0;
  color: #D4632D;
  font-size: 1rem;
  font-weight: 700;
}
.yt-eyebrow {
  font-size: 0.72rem;
  font-weight: 600;
  color: #999;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 0.5rem;
}
.yt-title {
  font-size: 1.3rem;
  font-weight: 700;
  color: #1a1a1a;
  line-height: 1.4;
  margin-bottom: 0.4rem;
}
.yt-title a { color: inherit; text-decoration: none; }
.yt-title a:hover { color: #D4632D; }
.yt-meta {
  font-size: 0.75rem;
  color: #aaa;
  margin-bottom: 1.5rem;
}

/* ── Smart Brevity ── */
.yt-sb {
  background: #fafafa;
  border-left: 3px solid #D4632D;
  padding: 1rem 1.2rem;
  margin-bottom: 2rem;
  border-radius: 0 6px 6px 0;
}
.yt-sb-label {
  font-size: 0.68rem;
  font-weight: 700;
  color: #D4632D;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 0.35rem;
}
.yt-sb-why {
  font-size: 1rem;
  font-weight: 700;
  color: #1a1a1a;
  line-height: 1.5;
  margin-bottom: 0.6rem;
}
.yt-sb-what {
  font-size: 0.88rem;
  color: #444;
  line-height: 1.7;
}

/* ── 섹션 ── */
.yt-section {
  margin-bottom: 2rem;
  scroll-margin-top: 1rem;
}
.yt-section-heading {
  font-size: 1rem;
  font-weight: 700;
  color: #1a1a1a;
  margin-bottom: 0.75rem;
  padding-bottom: 0.4rem;
  border-bottom: 1px solid #f0f0f0;
}
.yt-section-body {
  font-size: 0.9rem;
  color: #333;
  line-height: 1.8;
}
.yt-section-body mark {
  background: rgba(212, 99, 45, 0.12);
  color: inherit;
  border-radius: 2px;
  padding: 1px 2px;
}
.yt-quote {
  border-left: 3px solid #2563eb;
  background: rgba(37, 99, 235, 0.05);
  padding: 0.5rem 1rem;
  margin: 0.75rem 0;
  font-size: 0.88rem;
  color: #1d4ed8;
  font-style: italic;
  line-height: 1.7;
}
.yt-apply-key {
  background: rgba(37, 99, 235, 0.14);
  color: inherit;
  border-radius: 2px;
  padding: 0 3px;
  font-weight: 600;
}

/* ── Key Takeaways ── */
.yt-takeaways {
  background: #f8f8f8;
  border-radius: 8px;
  padding: 1.1rem 1.3rem;
  margin: 1.5rem 0;
}
.yt-takeaways-label {
  font-size: 0.7rem;
  font-weight: 700;
  color: #999;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 0.6rem;
}
.yt-takeaways ul { list-style: none; padding: 0; margin: 0; }
.yt-takeaways li {
  font-size: 0.88rem;
  color: #333;
  padding: 0.2rem 0 0.2rem 1rem;
  position: relative;
  line-height: 1.6;
}
.yt-takeaways li::before { content: '›'; position: absolute; left: 0; color: #D4632D; }

/* ── Tech / Apply ── */
.yt-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.5rem; }
.yt-tag {
  background: #f0f4ff; color: #2244aa;
  font-size: 0.7rem; padding: 0.15rem 0.45rem;
  border-radius: 4px;
}
.yt-apply ul { list-style: none; padding: 0; margin: 0.4rem 0 0; }
.yt-apply li {
  font-size: 0.82rem; color: #444;
  padding: 0.15rem 0 0.15rem 0.9rem;
  position: relative; line-height: 1.5;
}
.yt-apply li::before { content: '›'; position: absolute; left: 0; color: #0066cc; }
.yt-row-label {
  font-size: 0.68rem; font-weight: 700; color: #aaa;
  text-transform: uppercase; letter-spacing: 0.08em;
  margin: 1rem 0 0.35rem;
}

@media (max-width: 768px) {
  .yt-toc { display: none; }
  .yt-main { margin-left: 0 !important; }
  nav.site-nav { margin-left: 0 !important; }
}
</style>

<div class="yt-subtabs" id="yt-subtabs">
  <div class="yt-subtab active" data-cat="general">General</div>
  <div class="yt-subtab" data-cat="tech">Tech</div>
  <div class="yt-subtab" data-cat="claude">Claude</div>
  <div class="yt-subtab" data-cat="ais">AIs</div>
  <div class="yt-subtab" data-cat="ontology">Ontology</div>
</div>

<div id="yt-toc" class="yt-toc"></div>
<div class="yt-main" id="yt-main"></div>

<script>
const ALL_VIDEOS = [];
{% for item in site.data.sources %}
  {% assign key = item[0] %}
  {% if key contains 'youtube' %}
    {% for v in item[1] %}
ALL_VIDEOS.push({
  video_id:     {{ v.video_id | jsonify }},
  title:        {{ v.title | jsonify }},
  channel:      {{ v.channel | jsonify }},
  url:          {{ v.url | jsonify }},
  thumbnail:    {{ v.thumbnail | jsonify }},
  published_at: {{ v.published_at | jsonify }},
  fetched_at:   {{ v.fetched_at | jsonify }},
  playlist:     {{ v.playlist | jsonify }},
  playlist_index: {{ v.playlist_index | default: 9999 }},
  summary:      {{ v.summary | jsonify }}
});
    {% endfor %}
  {% endif %}
{% endfor %}

// 중복 제거 (video_id 기준, 먼저 나온 것 유지)
const seen = new Set();
const UNIQUE_VIDEOS = [];
for (const v of ALL_VIDEOS) {
  if (v.video_id && seen.has(v.video_id)) continue;
  if (v.video_id) seen.add(v.video_id);
  UNIQUE_VIDEOS.push(v);
}
ALL_VIDEOS.length = 0;
ALL_VIDEOS.push(...UNIQUE_VIDEOS);

ALL_VIDEOS.sort((a, b) => {
  const ia = a.playlist_index ?? 9999;
  const ib = b.playlist_index ?? 9999;
  return ia - ib;
});

/* ── 카테고리 매핑 ── */
let currentCat = 'general';

function filterByCategory(cat) {
  if (cat === 'general') return ALL_VIDEOS.filter(v => v.playlist !== 'ontology');
  return ALL_VIDEOS.filter(v => v.playlist === cat);
}

function escHtml(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function applyHighlights(body, highlights) {
  if (!highlights || !highlights.length) return escHtml(body);
  let result = escHtml(body);
  highlights.forEach(h => {
    if (!h) return;
    const safe = escHtml(h);
    result = result.replace(safe, `<mark>${safe}</mark>`);
  });
  return result;
}

function shortTitle(t) {
  return (t || '').split(/[|–—]/)[0].trim();
}

function buildTocData(videos) {
  return videos.map((v, vi) => {
    const vid = v.video_id || `v${vi}`;
    const num = String(videos.length - vi).padStart(2, '0');
    return {
      id: vid,
      num,
      label: shortTitle(v.title),
      fullTitle: v.title,
      sections: ((v.summary || {}).sections || []).map((sec, si) => ({
        id: `${vid}-s${si}`,
        label: `${String(si+1).padStart(2,'0')}. ${sec.heading.length > 26 ? sec.heading.slice(0,24)+'…' : sec.heading}`
      }))
    };
  });
}
const expandedSet = new Set();

function renderToc(tocData, activeId) {
  document.getElementById('yt-toc').innerHTML = tocData.map(item => {
    const isParentActive = activeId === item.id || item.sections.some(s => s.id === activeId);
    const isExpanded = expandedSet.has(item.id);
    const childrenHtml = isExpanded ? item.sections.map(sec =>
      `<a class="yt-toc-child${activeId === sec.id ? ' active' : ''}"
          href="#${sec.id}" onclick="scrollToId('${sec.id}');return false;">${escHtml(sec.label)}</a>`
    ).join('') : '';
    return `<a class="yt-toc-item${isParentActive ? ' active' : ''}"
       href="#${item.id}" title="${escHtml(item.fullTitle)}" onclick="toggleArticle('${item.id}');return false;"><span class="yt-toc-num">${item.num}</span>${escHtml(item.label)}</a>${childrenHtml}`;
  }).join('');
}

function scrollToId(id) {
  document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function expandArticle(vid) {
  if (expandedSet.has(vid)) return;
  const article = document.getElementById(vid);
  if (!article) return;
  const body = article.querySelector('.yt-article-body');
  if (!body) return;
  expandedSet.add(vid);
  body.style.display = '';
  article.style.cursor = 'default';
  const hint = article.querySelector('.yt-expand-hint');
  if (hint) hint.style.display = 'none';
  refreshToc(vid);
}

function toggleArticle(vid) {
  const article = document.getElementById(vid);
  if (!article) return;
  const body = article.querySelector('.yt-article-body');
  if (!body) return;
  if (expandedSet.has(vid)) {
    expandedSet.delete(vid);
    body.style.display = 'none';
    article.style.cursor = 'pointer';
    const hint = article.querySelector('.yt-expand-hint');
    if (hint) hint.style.display = '';
    article.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else {
    expandedSet.add(vid);
    body.style.display = '';
    article.style.cursor = 'default';
    article.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  refreshToc(vid);
}

function renderMain(videos) {
  const main = document.getElementById('yt-main');
  if (!videos.length) {
    main.innerHTML = '<p style="color:#bbb;margin-top:3rem;">아직 수집된 영상이 없습니다.</p>';
    return;
  }
  main.innerHTML = videos.map((v, vi) => {
    const vid = v.video_id || `v${vi}`;
    const s = v.summary || {};
    const sb = s.smart_brevity || {};
    const date = (v.published_at || '').slice(0, 10);
    const sectionsHtml = (s.sections || []).map((sec, si) => `
      <div class="yt-section" id="${vid}-s${si}">
        <h3 class="yt-section-heading"><span style="color:#bbb;font-weight:500;margin-right:8px;font-size:0.85em;">${String(si+1).padStart(2,'0')}</span>${escHtml(sec.heading)}</h3>
        <div class="yt-section-body">${applyHighlights(sec.body, sec.highlights)}</div>
        ${sec.quote ? `<blockquote class="yt-quote">"${escHtml(sec.quote)}"</blockquote>` : ''}
      </div>`).join('');
    const takeawaysHtml = (s.key_takeaways||[]).length ? `
      <div class="yt-takeaways">
        <p class="yt-takeaways-label">핵심 요점</p>
        <ul>${(s.key_takeaways||[]).map(t=>`<li>${escHtml(t)}</li>`).join('')}</ul>
      </div>` : '';
    const techHtml = (s.tech_stack||[]).length ? `
      <p class="yt-row-label">Tech / Stack</p>
      <div class="yt-tags">${(s.tech_stack||[]).map(t=>`<span class="yt-tag">${escHtml(t)}</span>`).join('')}</div>` : '';
    const applyHtml = (s.apply_points||[]).length ? `
      <div class="yt-apply">
        <p class="yt-row-label">적용 포인트</p>
        <ul>${(s.apply_points||[]).map(p=>{
          const text = typeof p === 'object' ? (p.text||'') : p;
          const key  = typeof p === 'object' ? p.key : false;
          return key
            ? `<li><mark class="yt-apply-key">${escHtml(text)}</mark></li>`
            : `<li>${escHtml(text)}</li>`;
        }).join('')}</ul>
      </div>` : '';
    return `
    <article class="yt-article" id="${vid}" onclick="expandArticle('${vid}')" style="cursor:pointer;">
      ${date ? `<p class="yt-eyebrow">${date}</p>` : ''}
      <h2 class="yt-title">
        <a href="${v.url}" target="_blank" rel="noopener" onclick="event.stopPropagation();">${escHtml(v.title)} ↗</a>
      </h2>
      <p class="yt-meta">${escHtml(v.channel||'')}</p>
      ${sb.why||sb.what ? `
      <div class="yt-sb">
        ${sb.why ? `<p class="yt-sb-label">Why it matters</p><p class="yt-sb-why">${escHtml(sb.why)}</p>` : ''}
        ${sb.what ? `<p class="yt-sb-label" style="margin-top:0.5rem;">What's happening</p><p class="yt-sb-what">${escHtml(sb.what)}</p>` : ''}
        <p class="yt-expand-hint">↓</p>
      </div>` : ''}
      <div class="yt-article-body" style="display:none;">
        ${sectionsHtml}${takeawaysHtml}${techHtml}${applyHtml}
      </div>
    </article>`;
  }).join('');
}

let activeVid = '';

function initObserver(tocData) {
  const articles = tocData.map(item => document.getElementById(item.id)).filter(Boolean);
  function update() {
    let current = '';
    for (const el of articles) {
      const top = el.getBoundingClientRect().top;
      if (top <= window.innerHeight * 0.4) current = el.id;
    }
    if (current && current !== activeVid) {
      activeVid = current;
      renderToc(tocData, activeVid);
    }
  }
  window.addEventListener('scroll', update, { passive: true });
  update();
}

function refreshToc(vid) {
  renderToc(window._tocData || tocData, vid || activeVid);
}

/* ── 서브탭 클릭 ── */
document.querySelectorAll('.yt-subtab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.yt-subtab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentCat = tab.dataset.cat;
    expandedSet.clear();
    activeVid = '';
    const filtered = filterByCategory(currentCat);
    const newToc = buildTocData(filtered);
    renderToc(newToc, '');
    renderMain(filtered);
    initObserver(newToc);
    window._tocData = newToc;
  });
});

/* ── 초기화 ── */
const filtered = filterByCategory(currentCat);
const tocData = buildTocData(filtered);
window._tocData = tocData;
renderToc(tocData, '');
renderMain(filtered);
initObserver(tocData);
</script>
