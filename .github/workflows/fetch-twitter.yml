name: Fetch Twitter

on:
  schedule:
    - cron: '30 22 * * *'  # 매일 07:30 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Set POST_DATE (KST)
        run: echo "POST_DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Fetch Twitter
        env:
          TWITTER_COOKIES: ${{ secrets.TWITTER_COOKIES }}
          POST_DATE: ${{ env.POST_DATE }}
        run: node scripts/fetch-twitter.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash -u || true
          git pull --rebase origin master
          git stash pop || true
          git add _data/sources/
          git diff --cached --quiet || git commit -m "[auto] twitter picks ${{ env.POST_DATE }}"
          git push
