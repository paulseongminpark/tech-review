name: Fetch YouTube

on:
  schedule:
    - cron: '0 22 * * *'  # 매일 07:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Set POST_DATE (KST)
        run: echo "POST_DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Fetch new videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          POST_DATE: ${{ env.POST_DATE }}
        run: node scripts/fetch-youtube.js

      - name: Summarize with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POST_DATE: ${{ env.POST_DATE }}
        run: node scripts/summarize-youtube.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin master
          git add _data/sources/ config/youtube-processed.json
          git diff --cached --quiet || git commit -m "[auto] youtube picks ${{ env.POST_DATE }}"
          git push
