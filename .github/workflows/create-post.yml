name: Create Daily Post

on:
  schedule:
    - cron: "30 21 * * *"  # 매일 06:30 KST (21:30 UTC 전날)
  workflow_dispatch:
    inputs:
      post_date:
        description: "날짜 (YYYY-MM-DD, 기본: 오늘)"
        required: false

permissions:
  contents: write
  actions: write

jobs:
  create-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set POST_DATE
        run: |
          if [ -n "${{ github.event.inputs.post_date }}" ]; then
            echo "POST_DATE=${{ github.event.inputs.post_date }}" >> $GITHUB_ENV
          else
            echo "POST_DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)" >> $GITHUB_ENV
          fi

      # ── KO 콘텐츠 fetch ──────────────────────────────────────────────────
      - name: Fetch KO content from Perplexity
        id: fetch_ko
        continue-on-error: true
        timeout-minutes: 20
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          LANG: ko
          OUTPUT_FILE: /tmp/perplexity-ko.md
          USE_DEEP_RESEARCH: "true"
        run: node scripts/fetch-perplexity.js

      - name: Parse KO content
        if: steps.fetch_ko.outcome == 'success'
        env:
          CONTENT_FILE: /tmp/perplexity-ko.md
          LANG: ko
        run: node scripts/parse-content.js

      # ── EN 번역 제거 (2026-03-16) — KO만 생성, API 비용 절감 ──────────

      # ── 섹션 추출 ────────────────────────────────────────────────────────
      - name: Extract sections
        if: steps.fetch_ko.outcome == 'success'
        run: node scripts/extract-sections.js --date ${{ env.POST_DATE }}

      # ── 커밋 + Push ──────────────────────────────────────────────────────
      - name: Commit and push
        run: |
          git config user.name "tech-review-bot"
          git config user.email "bot@tech-review.local"
          git add _posts/ko/ _data/sections/
          if git diff --cached --quiet; then
            echo "변경사항 없음"
            echo "CHANGED=false" >> $GITHUB_ENV
          else
            git commit -m "[tech-review] ${POST_DATE} daily post 자동 생성"
            git push
            echo "CHANGED=true" >> $GITHUB_ENV
          fi

      - name: Trigger deploy
        if: env.CHANGED == 'true'
        run: gh workflow run deploy.yml --repo paulseongminpark/tech-review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
