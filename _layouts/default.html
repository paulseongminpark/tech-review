<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, 'Noto Sans KR', sans-serif; max-width: 720px; margin: 0 auto; padding: 2rem 1rem; color: #1a1a1a; line-height: 1.7; }
    a { color: #0066cc; text-decoration: none; }
    .lang-toggle { position: fixed; top: 1rem; right: 1rem; display: flex; gap: 0.5rem; }
    .lang-toggle a { padding: 0.25rem 0.75rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.85rem; }
    .lang-toggle a.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
    .post-list { list-style: none; }
    .post-list li { padding: 1rem 0; border-bottom: 1px solid #eee; }
    .post-meta { color: #666; font-size: 0.85rem; }
    .post-tags { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .post-tags span { background: #f0f0f0; padding: 0.15rem 0.5rem; border-radius: 3px; font-size: 0.8rem; }
    h1 { margin-bottom: 1.5rem; }
    h2 { margin: 1.5rem 0 0.5rem; font-size: 1.1rem; }
    .content h2 { color: #0055bb; font-size: 1.2rem; border-bottom: 2px solid #e0eaff; padding-bottom: 0.3rem; }
    .content h3 { color: #333; font-size: 1rem; margin: 1rem 0 0.3rem; }
    .content p { margin: 0.5rem 0; }
    .content ul { list-style: none; padding-left: 1rem; }
    .content li { margin: 0.25rem 0; }
    .site-nav { display:flex; gap:1rem; margin-bottom:2rem; border-bottom:1px solid #eee; padding-bottom:0.75rem; }
    .site-nav a { color:#666; font-size:0.9rem; text-decoration:none; padding:0.25rem 0; }
    .site-nav a.active { color:#1a1a1a; font-weight:600; border-bottom:2px solid #1a1a1a; }
  </style>
</head>
<body>
  {% include lang-toggle.html %}
  {% assign lang = page.lang | default: 'ko' %}
  <nav class="site-nav">
    <a href="{{ site.baseurl }}/{{ lang }}/"
       {% unless page.url contains 'daily-digest' or page.url contains '/twitter/' or page.url contains '/youtube/' %}class="active"{% endunless %}>Home</a>
    <a href="{{ site.baseurl }}/{{ lang }}/daily-digest/"
       {% if page.url contains 'daily-digest' %}class="active"{% endif %}>Daily Digest</a>
    <a href="{{ site.baseurl }}/{{ lang }}/twitter/"
       {% if page.url contains '/twitter/' %}class="active"{% endif %}>Twitter</a>
    <a href="{{ site.baseurl }}/{{ lang }}/youtube/"
       {% if page.url contains '/youtube/' %}class="active"{% endif %}>YouTube</a>
  </nav>
  {{ content }}
</body>
</html>
