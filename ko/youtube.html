---
layout: default
title: YouTube
lang: ko
permalink: /ko/youtube/
---

<style>
/* ── reset ── */
body { max-width: none !important; margin: 0 !important; padding: 0 !important; }
nav.site-nav { position: relative; z-index: 200; background: #fff; padding: 0.75rem 1.5rem !important; margin-bottom: 0 !important; }
.site-content, .wrapper, .page-content { margin: 0 !important; padding: 0 !important; }

/* ── 4-column finder ── */
.yt-finder {
  display: flex;
  height: calc(100vh - 48px);
  overflow: hidden;
}
.yt-col {
  height: 100%;
  overflow-y: auto;
  border-right: 1px solid #e8e8e8;
  scrollbar-width: none;
  box-sizing: border-box;
}
.yt-col::-webkit-scrollbar { display: none; }

/* Col 1: 카테고리 */
.yt-col-cat {
  width: 140px; min-width: 140px;
  background: #f7f7f7;
  padding: 0;
}
.yt-cat-item {
  display: block;
  padding: 8px 16px;
  font-size: 0.78rem;
  font-weight: 600;
  color: #666;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  border-left: 3px solid transparent;
  transition: all 0.12s;
}
.yt-cat-item:hover { color: #333; background: #f0f0f0; }
.yt-cat-item.active { color: #D4632D; border-left-color: #D4632D; background: #fff; }
.yt-cat-count {
  font-size: 0.6rem;
  color: #bbb;
  font-weight: 400;
  margin-left: 4px;
}

/* Col 2: 영상 목록 */
.yt-col-videos {
  width: 260px; min-width: 260px;
  background: #fcfcfc;
  padding: 0;
}
.yt-col-header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: inherit;
  padding: 10px 14px;
  font-size: 0.68rem;
  font-weight: 700;
  color: #999;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  border-bottom: 1px solid #eee;
}
.yt-vid-item {
  display: block;
  padding: 10px 14px;
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: all 0.12s;
}
.yt-vid-item:hover { background: #f5f5f5; }
.yt-vid-item.active { border-left-color: #D4632D; background: rgba(212,99,45,0.06); }
.yt-vid-item.active .yt-vid-title { color: #D4632D; }
.yt-vid-item.active .yt-vid-channel { color: #D4632D; opacity: 0.7; }
.yt-vid-title {
  font-size: 0.8rem;
  font-weight: 600;
  color: #333;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.yt-vid-item.active .yt-vid-title { color: #D4632D; }
.yt-vid-channel {
  font-size: 0.65rem;
  color: #aaa;
  margin-top: 3px;
}
.yt-vid-playlist-tag {
  display: inline-block;
  font-size: 0.55rem;
  color: #999;
  background: #f0f0f0;
  padding: 1px 5px;
  border-radius: 3px;
  margin-top: 3px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* Col 3: 섹션 네비 */
.yt-col-sections {
  width: 160px; min-width: 160px;
  background: #f9f9f9;
  padding: 0;
}
.yt-sec-header {
  padding: 10px 14px;
  font-size: 0.68rem;
  font-weight: 700;
  color: #999;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.yt-sec-item {
  display: block;
  padding: 7px 14px;
  font-size: 0.78rem;
  color: #555;
  cursor: pointer;
  border-left: 3px solid transparent;
  line-height: 1.4;
  transition: all 0.12s;
}
.yt-sec-item:hover { background: #f0f0f0; color: #333; }
.yt-sec-item.active { color: #D4632D; font-weight: 600; border-left-color: #D4632D; background: rgba(212,99,45,0.06); }
.yt-sec-item.active .yt-sec-num { color: #D4632D; }
.yt-sec-num {
  font-size: 0.65rem;
  color: #bbb;
  margin-right: 6px;
  font-weight: 400;
}
.yt-sec-divider {
  height: 1px;
  background: #eee;
  margin: 6px 14px;
}
.yt-sec-meta-item {
  display: block;
  padding: 8px 16px;
  font-size: 0.78rem;
  font-weight: 600;
  color: #666;
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: all 0.12s;
}
.yt-sec-meta-item:hover { color: #333; background: #f0f0f0; }
.yt-sec-meta-item.active { color: #D4632D; border-left-color: #D4632D; background: rgba(212,99,45,0.06); }

/* Col 4: 본문 */
.yt-col-content {
  flex: 1;
  background: #fff;
  padding: 2rem 2.5rem;
  min-width: 0;
}
.yt-content-empty {
  color: #ccc;
  font-size: 0.9rem;
  margin-top: 3rem;
  text-align: center;
}

/* ── 본문 내 스타일 ── */
.yt-c-title {
  font-size: 1.3rem;
  font-weight: 700;
  color: #1a1a1a;
  line-height: 1.4;
  margin-bottom: 0.3rem;
}
.yt-c-title a { color: inherit; text-decoration: none; }
.yt-c-title a:hover { color: #D4632D; }
.yt-c-meta { font-size: 0.75rem; color: #aaa; margin-bottom: 1.5rem; }
.yt-c-sb {
  background: #fafafa;
  border-left: 3px solid #D4632D;
  padding: 1rem 1.2rem;
  margin-bottom: 2rem;
  border-radius: 0 6px 6px 0;
}
.yt-c-sb-label {
  font-size: 0.68rem; font-weight: 700; color: #D4632D;
  text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.35rem;
}
.yt-c-sb-why { font-size: 1rem; font-weight: 700; color: #1a1a1a; line-height: 1.5; margin-bottom: 0.6rem; }
.yt-c-sb-what { font-size: 0.88rem; color: #444; line-height: 1.7; }

.yt-c-section-heading {
  font-size: 1.05rem; font-weight: 700; color: #1a1a1a;
  margin-bottom: 0.75rem; padding-bottom: 0.4rem; border-bottom: 1px solid #f0f0f0;
}
.yt-c-section-body { font-size: 0.9rem; color: #333; line-height: 1.8; }
.yt-c-section-body mark { background: rgba(212,99,45,0.12); color: inherit; border-radius: 2px; padding: 1px 2px; }
.yt-c-quote {
  border-left: 3px solid #2563eb; background: rgba(37,99,235,0.05);
  padding: 0.5rem 1rem; margin: 0.75rem 0; font-size: 0.88rem;
  color: #1d4ed8; font-style: italic; line-height: 1.7;
}

.yt-c-takeaways { background: #f8f8f8; border-radius: 8px; padding: 1.1rem 1.3rem; margin: 1.5rem 0; }
.yt-c-takeaways-label { font-size: 0.7rem; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.6rem; }
.yt-c-takeaways ul { list-style: none; padding: 0; margin: 0; }
.yt-c-takeaways li { font-size: 0.88rem; color: #333; padding: 0.2rem 0 0.2rem 1rem; position: relative; line-height: 1.6; }
.yt-c-takeaways li::before { content: '›'; position: absolute; left: 0; color: #D4632D; }

.yt-c-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.5rem; }
.yt-c-tag { background: #f0f4ff; color: #2244aa; font-size: 0.7rem; padding: 0.15rem 0.45rem; border-radius: 4px; }
.yt-c-apply ul { list-style: none; padding: 0; margin: 0.4rem 0 0; }
.yt-c-apply li { font-size: 0.82rem; color: #444; padding: 0.15rem 0 0.15rem 0.9rem; position: relative; line-height: 1.5; }
.yt-c-apply li::before { content: '›'; position: absolute; left: 0; color: #0066cc; }
.yt-c-apply-key { background: rgba(37,99,235,0.14); border-radius: 2px; padding: 0 3px; font-weight: 600; }
.yt-c-row-label { font-size: 0.68rem; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: 0.08em; margin: 1.5rem 0 0.35rem; }

@media (max-width: 900px) {
  .yt-finder { flex-direction: column; height: auto; }
  .yt-col { width: 100% !important; min-width: 0 !important; height: auto; max-height: 40vh; border-right: none; border-bottom: 1px solid #eee; }
  .yt-col-content { max-height: none; }
}
</style>

<div class="yt-finder">
  <div class="yt-col yt-col-cat" id="yt-col-cat"></div>
  <div class="yt-col yt-col-videos" id="yt-col-videos"></div>
  <div class="yt-col yt-col-sections" id="yt-col-sections"></div>
  <div class="yt-col yt-col-content" id="yt-col-content">
    <p class="yt-content-empty">← 카테고리와 영상을 선택하세요</p>
  </div>
</div>

<script>
const ALL_VIDEOS = [];
{% for item in site.data.sources %}
  {% assign key = item[0] %}
  {% if key contains 'youtube' %}
    {% for v in item[1] %}
ALL_VIDEOS.push({
  video_id:     {{ v.video_id | jsonify }},
  title:        {{ v.title | jsonify }},
  channel:      {{ v.channel | jsonify }},
  url:          {{ v.url | jsonify }},
  published_at: {{ v.published_at | jsonify }},
  fetched_at:   {{ v.fetched_at | jsonify }},
  playlist:     {{ v.playlist | jsonify }},
  playlist_index: {{ v.playlist_index | default: 9999 }},
  summary:      {{ v.summary | jsonify }}
});
    {% endfor %}
  {% endif %}
{% endfor %}

// 중복 제거
const seen = new Set();
const UNIQUE = ALL_VIDEOS.filter(v => {
  if (v.video_id && seen.has(v.video_id)) return false;
  if (v.video_id) seen.add(v.video_id);
  return true;
});
ALL_VIDEOS.length = 0;
ALL_VIDEOS.push(...UNIQUE);

const PLAYLIST_ORDER = ['claude', 'build', 'design', 'insight', 'ontology'];
ALL_VIDEOS.sort((a, b) => {
  const oa = Math.max(PLAYLIST_ORDER.indexOf(a.playlist), 0);
  const ob = Math.max(PLAYLIST_ORDER.indexOf(b.playlist), 0);
  if (oa !== ob) return oa - ob;
  return (a.playlist_index ?? 9999) - (b.playlist_index ?? 9999);
});

/* ── State ── */
let selectedCat = null;
let selectedVideoId = null;
let selectedView = null; // 'overview' | 'takeaways' | 'tech' | 'apply' | section index

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function highlight(body, hl) {
  if (!hl || !hl.length) return esc(body);
  let r = esc(body);
  hl.forEach(h => { if (h) r = r.replace(esc(h), `<mark>${esc(h)}</mark>`); });
  return r;
}

/* ── Col 1: Categories ── */
function renderCats() {
  const counts = {};
  ALL_VIDEOS.forEach(v => { counts[v.playlist] = (counts[v.playlist]||0) + 1; });
  const el = document.getElementById('yt-col-cat');
  el.innerHTML = [{id:'all', label:'ALL', count: ALL_VIDEOS.length}]
    .concat(PLAYLIST_ORDER.map(p => ({id: p, label: p.toUpperCase(), count: counts[p]||0})))
    .map(c => `<div class="yt-cat-item${selectedCat===c.id?' active':''}" onclick="selectCat('${c.id}')">${c.label}<span class="yt-cat-count">${c.count}</span></div>`)
    .join('');
}

function selectCat(cat) {
  selectedCat = cat;
  selectedVideoId = null;
  selectedView = null;
  renderCats();
  renderVideos();
  document.getElementById('yt-col-sections').innerHTML = '';
  document.getElementById('yt-col-content').innerHTML = '<p class="yt-content-empty">← 영상을 선택하세요</p>';
  // 클릭한 카테고리를 Col 1 상단으로
  setTimeout(() => {
    const col = document.getElementById('yt-col-cat');
    const active = col.querySelector('.yt-cat-item.active');
    if (active) col.scrollTop = active.offsetTop;
  }, 30);
}

/* ── Col 2: Videos ── */
function getVideos() {
  if (!selectedCat || selectedCat === 'all') return ALL_VIDEOS;
  return ALL_VIDEOS.filter(v => v.playlist === selectedCat);
}

function renderVideos() {
  const videos = getVideos();
  const el = document.getElementById('yt-col-videos');
  if (!videos.length) { el.innerHTML = '<div class="yt-col-header">Titles</div><p style="color:#ccc;padding:1rem;font-size:0.8rem;">영상 없음</p>'; return; }
  el.innerHTML = '<div class="yt-col-header">Titles</div>' + videos.map(v => {
    const vid = v.video_id;
    const hasSummary = v.summary && (v.summary.sections || v.summary.key_takeaways);
    return `<div class="yt-vid-item${selectedVideoId===vid?' active':''}" onclick="selectVideo('${vid}')">
      <div class="yt-vid-title">${esc(v.title)}</div>
      <div class="yt-vid-channel">${esc(v.channel||'')}</div>
      ${selectedCat==='all'?`<span class="yt-vid-playlist-tag">${esc(v.playlist||'')}</span>`:''}
    </div>`;
  }).join('');
}

function selectVideo(vid) {
  selectedVideoId = vid;
  selectedView = 'overview';
  renderVideos();
  renderSections();
  renderContent();
  // 클릭한 영상을 Col 2 상단으로 (TITLES 헤더 바로 아래)
  requestAnimationFrame(() => {
    const col = document.getElementById('yt-col-videos');
    const active = col.querySelector('.yt-vid-item.active');
    if (active) {
      const headerH = col.querySelector('.yt-col-header')?.getBoundingClientRect().height || 0;
      const colTop = col.getBoundingClientRect().top;
      const activeTop = active.getBoundingClientRect().top;
      col.scrollTop += (activeTop - colTop - headerH);
    }
  });
}

/* ── Col 3: Sections ── */
function getVideo() { return ALL_VIDEOS.find(v => v.video_id === selectedVideoId); }

function renderSections() {
  const v = getVideo();
  const el = document.getElementById('yt-col-sections');
  if (!v) { el.innerHTML = ''; return; }
  const s = v.summary || {};
  const sections = s.sections || [];

  let html = `<div class="yt-col-header">Overview</div>`;
  const sb3 = s.smart_brevity || {};
  const ap3 = s.apply_points || {};
  const hasAP = ap3.what || ap3.why_it_matters;
  // Nav items matching Col 4 order
  if (sb3.why) html += `<div class="yt-sec-meta-item" onclick="selectView('wim')">Why it matters</div>`;
  if (hasAP) {
    html += `<div class="yt-sec-meta-item" onclick="selectView('apply')">Apply Point</div>`;
  }
  if (sb3.what) html += `<div class="yt-sec-meta-item" onclick="selectView('whats')">What's happening</div>`;
  if (sections.length) {
    html += `<div class="yt-sec-meta-item" onclick="selectView('sections')">Sections (${sections.length})</div>`;
  }
  if ((s.key_takeaways||[]).length) html += `<div class="yt-sec-meta-item" onclick="selectView('takeaways')">Takeaways</div>`;
  el.innerHTML = html;
}

let activeSecIndex = null;

function selectView(view) {
  const contentEl = document.getElementById('yt-col-content');
  // overview 모드 유지하면서 해당 위치로 스크롤
  if (selectedView !== 'overview') {
    selectedView = 'overview';
    renderContent();
  }
  setTimeout(() => {
    // sections 클릭 시 details 토글 열기
    if (view === 'sections') {
      const details = contentEl.querySelector('details.yt-c-details');
      if (details) { details.open = true; details.scrollIntoView({behavior:'smooth', block:'start'}); }
      return;
    }
    const targetId = typeof view === 'number' ? 'yt-sec-' + view : 'yt-sec-' + view;
    const target = document.getElementById(targetId);
    if (target) contentEl.scrollTop = target.offsetTop - contentEl.offsetTop;
  }, 50);
}

/* ── Col 4: Content ── */
function renderContent() {
  const v = getVideo();
  const el = document.getElementById('yt-col-content');
  if (!v) { el.innerHTML = '<p class="yt-content-empty">← 영상을 선택하세요</p>'; return; }
  const s = v.summary || {};
  const sb = s.smart_brevity || {};

  // Header (always shown)
  let header = `
    <h2 class="yt-c-title"><a href="${v.url}" target="_blank" rel="noopener">${esc(v.title)} ↗</a></h2>
    <p class="yt-c-meta">${esc(v.channel||'')}${v.published_at ? ' · '+v.published_at : (v.fetched_at ? ' · '+v.fetched_at : '')}</p>`;

  let body = '';

  if (selectedView === 'overview') {
    const ap = s.apply_points;
    // 1. WIM (hero)
    if (sb.why) {
      body += `<div class="yt-c-sb">`;
      body += `<div id="yt-sec-wim"><p class="yt-c-sb-label">Why it matters</p><p class="yt-c-sb-why">${esc(sb.why)}</p></div>`;
      body += `</div>`;
    }
    // 2. Apply Point (새 구조: level/where/action/trigger)
    if (ap && ap.what) {
      const lvLabels = {1:'시스템 액션', 2:'설계 참고', 3:'사고 자극'};
      const lv = ap.level || 3;
      const fields = ['where','what','why','how','when'];
      body += `<div id="yt-sec-apply" class="yt-c-sb" style="margin-top:0.75rem; border-left:3px solid #2563eb; padding-left:12px;">`;
      body += `<p class="yt-c-sb-label" style="color:#1d4ed8;">Apply Point · L${lv} ${lvLabels[lv]}</p>`;
      fields.forEach(f => { if (ap[f]) body += `<p class="yt-c-sb-label" style="margin-top:0.5rem; color:#1d4ed8;">${f.toUpperCase()}</p><p class="yt-c-sb-what">${esc(ap[f])}</p>`; });
      body += `</div>`;
    }
    // 2b. 이전 구조 호환 (why_it_matters 형태)
    if (ap && ap.why_it_matters && !ap.what) {
      body += `<div id="yt-sec-apply" class="yt-c-sb" style="margin-top:0.75rem; border-left:3px solid #2563eb;">`;
      body += `<p class="yt-c-sb-label" style="color:#1d4ed8;">Why it matters to me</p><p class="yt-c-sb-why">${esc(ap.why_it_matters)}</p>`;
      body += `</div>`;
    }
    // 3. What's happening + SB axioms (펼침)
    if (sb.what) {
      body += `<div id="yt-sec-whats" style="margin-bottom:1rem; margin-top:1rem;">`;
      body += `<p class="yt-c-sb-label">What's happening</p><p class="yt-c-sb-what">${esc(sb.what)}</p>`;
      (sb.axioms||[]).forEach(ax => { body += `<p class="yt-c-sb-label" style="margin-top:0.5rem;">${esc(ax.label)}</p><p class="yt-c-sb-what">${esc(ax.content)}</p>`; });
      body += `</div>`;
    }
    // 4. Sections (토글 접힘)
    if ((s.sections||[]).length) {
      body += `<details id="yt-sec-sections" class="yt-c-details" style="margin-bottom:1rem;">`;
      body += `<summary class="yt-c-sb-label" style="cursor:pointer; user-select:none;">Sections (${s.sections.length})</summary>`;
      body += `<div style="margin-top:0.5rem;">`;
      (s.sections||[]).forEach((sec, i) => {
        body += `<div id="yt-sec-${i}" style="margin-bottom:1.5rem; scroll-margin-top: 1rem;">
          <h3 class="yt-c-section-heading"><span style="color:#bbb;font-weight:500;margin-right:8px;font-size:0.85em;">${String(i+1).padStart(2,'0')}</span>${esc(sec.heading)}</h3>
          <div class="yt-c-section-body">${highlight(sec.body, sec.highlights)}</div>
          ${sec.quote ? `<blockquote class="yt-c-quote">"${esc(sec.quote)}"</blockquote>` : ''}
        </div>`;
      });
      body += `</div></details>`;
    }
    // 5. Takeaways / Tech
    if ((s.key_takeaways||[]).length) {
      body += `<div id="yt-sec-takeaways" style="scroll-margin-top:1rem; margin-top:2rem; padding-top:1.5rem; border-top:1px solid #eee;"><div class="yt-c-takeaways"><p class="yt-c-takeaways-label">Takeaways</p><ul>${(s.key_takeaways||[]).map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div></div>`;
    }
    if ((s.tech_stack||[]).length) {
      body += `<div id="yt-sec-tech" style="scroll-margin-top:1rem; margin-top:2rem; padding-top:1.5rem; border-top:1px solid #eee;"><p class="yt-c-row-label">Tech / Stack</p><div class="yt-c-tags">${(s.tech_stack||[]).map(t=>`<span class="yt-c-tag">${esc(t)}</span>`).join('')}</div></div>`;
    }
  }

  el.innerHTML = header + body;
  el.scrollTop = 0;

  // overview 모드일 때 스크롤 observer 연결
  if (selectedView === 'overview') {
    activeSecIndex = 'yt-sec-wim';
    updateSecHighlight();
    initContentObserver();
  }
}

/* ── Col 4 스크롤 → Col 3 하이라이트 ── */
function initContentObserver() {
  const contentEl = document.getElementById('yt-col-content');
  if (!contentEl) return;
  // Col 4에 실제 존재하는 앵커만 수집
  const ids = ['yt-sec-wim','yt-sec-apply','yt-sec-whats','yt-sec-sections','yt-sec-takeaways']
    .filter(id => document.getElementById(id));

  contentEl.addEventListener('scroll', function onScroll() {
    if (selectedView !== 'overview') { contentEl.removeEventListener('scroll', onScroll); return; }
    // 스크롤 끝 감지
    const atBottom = contentEl.scrollTop + contentEl.clientHeight >= contentEl.scrollHeight - 10;
    if (atBottom && ids.length) {
      if (activeSecIndex !== ids[ids.length - 1]) { activeSecIndex = ids[ids.length - 1]; updateSecHighlight(); }
      return;
    }
    let current = null;
    const containerRect = contentEl.getBoundingClientRect();
    for (const id of ids) {
      const el = document.getElementById(id);
      if (!el) continue;
      const rect = el.getBoundingClientRect();
      if (rect.top - containerRect.top <= containerRect.height * 0.5) current = id;
    }
    if (current !== null && current !== activeSecIndex) {
      activeSecIndex = current;
      updateSecHighlight();
    }
  }, { passive: true });
}

function updateSecHighlight() {
  const col = document.getElementById('yt-col-sections');
  if (!col) return;
  col.querySelectorAll('.yt-sec-meta-item').forEach(el => el.classList.remove('active'));
  if (!activeSecIndex) return;
  const key = activeSecIndex.replace('yt-sec-','');
  col.querySelectorAll('.yt-sec-meta-item').forEach(el => {
    const onclick = el.getAttribute('onclick') || '';
    if (onclick.includes("'" + key + "'")) el.classList.add('active');
  });
}

/* ── Init: 모두 열린 상태 ── */
selectedCat = 'all';
renderCats();
renderVideos();
// 첫 영상 자동 선택
if (ALL_VIDEOS.length) {
  selectVideo(ALL_VIDEOS[0].video_id);
}
</script>
