---
layout: default
title: Twitter
lang: ko
permalink: /ko/twitter/
---

<style>
  .bm-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.75rem;
  }
  .bm-header h1 {
    font-size: 1.3rem;
    font-weight: 700;
    margin: 0;
  }
  .bm-badge {
    font-size: 0.72rem;
    color: #888;
    background: #f5f5f5;
    border: 1px solid #e0e0e0;
    padding: 0.2rem 0.55rem;
    border-radius: 20px;
    letter-spacing: 0.02em;
  }

  .bm-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1rem;
  }
  @media (max-width: 900px) { .bm-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 540px) { .bm-grid { grid-template-columns: 1fr; } }

  .bm-card {
    border: 1px solid #e8e8e8;
    border-radius: 10px;
    padding: 1.1rem;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    transition: box-shadow 0.15s, border-color 0.15s;
    position: relative;
    background: #fff;
  }
  .bm-card:hover {
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    border-color: #ccc;
  }
  .bm-card.open {
    aspect-ratio: unset;
    overflow: visible;
  }

  .bm-meta {
    font-size: 0.72rem;
    color: #aaa;
    margin-bottom: 0.6rem;
    display: flex;
    align-items: center;
    gap: 0.35rem;
    flex-wrap: wrap;
  }
  .bm-meta strong { color: #555; }
  .bm-meta a { color: #0066cc; font-size: 0.72rem; }

  .bm-why {
    font-size: 0.88rem;
    font-weight: 600;
    color: #1a1a1a;
    line-height: 1.5;
    flex: 1;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 5;
    -webkit-box-orient: vertical;
  }
  .bm-card.open .bm-why {
    -webkit-line-clamp: unset;
    overflow: visible;
  }

  .bm-tags {
    margin-top: 0.65rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
  }
  .bm-tag {
    background: #f0f4ff;
    color: #2244aa;
    font-size: 0.7rem;
    padding: 0.15rem 0.45rem;
    border-radius: 4px;
    white-space: nowrap;
  }

  .bm-detail {
    display: none;
    margin-top: 0.9rem;
    border-top: 1px solid #eee;
    padding-top: 0.9rem;
  }
  .bm-card.open .bm-detail { display: block; }

  .bm-label {
    font-size: 0.7rem;
    font-weight: 700;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 0.3rem;
    margin-top: 0.75rem;
  }
  .bm-label:first-child { margin-top: 0; }

  .bm-what {
    font-size: 0.85rem;
    color: #333;
    line-height: 1.6;
    white-space: pre-line;
  }
  .bm-points {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .bm-points li {
    font-size: 0.82rem;
    color: #444;
    padding: 0.15rem 0 0.15rem 0.9rem;
    position: relative;
    line-height: 1.5;
  }
  .bm-points li::before {
    content: '›';
    position: absolute;
    left: 0;
    color: #0066cc;
  }
  .bm-points.explore li::before { color: #bbb; }

  .bm-expand-btn {
    margin-top: 0.6rem;
    font-size: 0.72rem;
    color: #0066cc;
    cursor: pointer;
    display: inline-block;
    user-select: none;
  }
</style>

<div class="bm-header">
  <h1>Twitter Bookmarks</h1>
  <span class="bm-badge">Summarized by Claude</span>
</div>

<div class="bm-grid" id="bm-grid"></div>

<script>
const BOOKMARKS = {{ site.data.bookmarks | jsonify }};

function renderGrid() {
  const grid = document.getElementById('bm-grid');
  if (!BOOKMARKS || BOOKMARKS.length === 0) {
    grid.innerHTML = '<p style="color:#bbb;">아직 북마크가 없습니다.</p>';
    return;
  }

  grid.innerHTML = BOOKMARKS.map((bm, i) => {
    const tags = (bm.tech_stack || []).slice(0, 4).map(t =>
      `<span class="bm-tag">${t}</span>`
    ).join('');

    const applyList = (bm.apply_points || []).map(p =>
      `<li>${p}</li>`
    ).join('');

    const exploreList = (bm.explore_points || []).map(p =>
      `<li>${p}</li>`
    ).join('');

    return `
    <div class="bm-card" id="card-${i}" onclick="toggleCard(${i})">
      <div class="bm-meta">
        <strong>@${bm.author || '—'}</strong>
        <span>·</span>
        <span>${(bm.date || '').slice(0, 10)}</span>
        ${bm.url ? `<span>·</span><a href="${bm.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">원문 →</a>` : ''}
      </div>

      <div class="bm-why">${bm.smart_brevity?.why || '—'}</div>

      ${tags ? `<div class="bm-tags">${tags}</div>` : ''}

      <span class="bm-expand-btn" id="btn-${i}">더보기 ▾</span>

      <div class="bm-detail">
        <p class="bm-label">What's happening</p>
        <p class="bm-what">${bm.smart_brevity?.what || ''}</p>

        ${applyList ? `
        <p class="bm-label">적용 포인트</p>
        <ul class="bm-points">${applyList}</ul>` : ''}

        ${exploreList ? `
        <p class="bm-label">더 생각해볼 것</p>
        <ul class="bm-points explore">${exploreList}</ul>` : ''}
      </div>
    </div>`;
  }).join('');
}

function toggleCard(i) {
  const card = document.getElementById('card-' + i);
  const btn = document.getElementById('btn-' + i);
  const isOpen = card.classList.toggle('open');
  btn.textContent = isOpen ? '접기 ▴' : '더보기 ▾';
}

renderGrid();
</script>
