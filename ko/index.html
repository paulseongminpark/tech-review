---
layout: default
title: Tech Review
lang: ko
---
<div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:1.5rem;">
  <h1 style="margin-bottom:0;">Tech Review</h1>
  <a href="{{ site.baseurl }}/ko/topics/" style="font-size:0.9rem; color:#0066cc;">Topics →</a>
</div>
<ul class="post-list">
  {% assign ko_posts = site.posts | where: "lang", "ko" %}
  {% for post in ko_posts %}
  <li>
    <p class="post-meta">{{ post.date | date: "%Y-%m-%d" }}</p>
    <a href="{{ post.url | prepend: site.baseurl }}"><strong>{{ post.title }}</strong></a>
    <div class="post-tags">
      {% for tag in post.tags %}<span>{{ tag }}</span>{% endfor %}
    </div>
  </li>
  {% endfor %}
</ul>
